name: PettyCashBox
options:
  bundleIdPrefix: com.shimondeitel.pettycashbox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  PettyCashBox:
    type: application
    platform: iOS
    sources:
      - path: PettyCashBox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.pettycashbox
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: PettyCashBox/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  PettyCashBoxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PettyCashBoxTests
      - path: PettyCashBox.storekit
    dependencies:
      - target: PettyCashBox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.pettycashbox.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  PettyCashBoxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PettyCashBoxUITests
    dependencies:
      - target: PettyCashBox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.pettycashbox.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  PettyCashBox:
    build:
      targets:
        PettyCashBox: all
        PettyCashBoxTests: [test]
        PettyCashBoxUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: PettyCashBox.storekit
    test:
      config: Debug
      storeKitConfiguration: PettyCashBox.storekit
      targets:
        - PettyCashBoxTests
        - PettyCashBoxUITests
    archive:
      config: Release
